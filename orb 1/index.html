<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the 1 Orb</title>
    <link rel="stylesheet" href="design&properties.css">
</head>
<body>

<!-- ===== HOME PAGE ===== -->
<!-- Ito yung unang screen na makikita -->
<div id="home">
    <h1 class="metal-title">FIND THE 1 ORB</h1>
    <p class="metal-subtitle">A Game of Chance and Will</p>

    <!-- Pag click nito, papasok sa game -->
    <button class="metal-btn" onclick="enterGame()">ENTER THE RITUAL</button>
</div>

<!-- ===== GAME PAGE ===== -->
<!-- Hidden ito by default, lalabas lang pag nag Enter Game -->
<div id="game">
    <div class="game-container">

        <h2>Find the 1 Orb</h2>

        <!-- Controls: names + difficulty -->
        <div id="controls">
            <input id="p1Name" placeholder="Player 1">
            <input id="p2Name" placeholder="Player 2">

            <!-- Easy = konti boxes, Hard = mas madami -->
            <select id="difficulty">
                <option value="normal">Easy</option>
                <option value="hard">Hard</option>
            </select>
        </div>

        <!-- Scoreboard area -->
        <div id="scoreboard">
            <div id="p1Score">Player 1: 0 | ❤️❤️❤️</div>
            <div id="timer">Time: 2:00</div>
            <div id="turn">Turn: Player 1</div>
            <div id="p2Score">Player 2: 0 | ❤️❤️❤️</div>
        </div>

        <!-- Button para magsimula ng round -->
        <button id="roundBtn">START ROUND</button>

        <!-- Dito lalabas yung mga boxes -->
        <div id="arena"></div>

        <!-- Messages like “Wrong choice” -->
        <div id="message"></div>

        <!-- Extra buttons -->
        <div id="gameButtons">
            <button onclick="restartGame()">RESTART</button>
            <button onclick="backToHome()">HOME</button>
        </div>
    </div>
</div>

<!-- ===== WINNER OVERLAY ===== -->
<!-- Full screen overlay pag tapos na ang game -->
<div id="winnerOverlay">
    <h1 id="winnerText"></h1>
    <button onclick="closeOverlay()">CLOSE</button>
</div>
<script src="shibalism.js"></script>
</body>
</html>
