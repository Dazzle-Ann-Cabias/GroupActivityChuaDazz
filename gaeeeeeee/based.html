<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="design&properties.css"> <!-- gumagana yung css pero same attributes/elements lang yung nakalagay sa bawat div -->
</head>
<body>

<!-- THE HOME PAGE NA HINDI GUMAGANAAAA AMP (T-T) -->
<div id="home">
<div>

<h1>FIND THE 1 ORB</h1>
<div style="text-align:center">
<button onclick="enterGame()">PRESS TO PLAY</button>
</div>

<!-- LAHAT NG ABOUT SA GAMEEEEEE -->
<div id="game">
<div class="game-container">
    <h2>FIND THE 1 ORB</h2>
<!-- placeholder na nasira dahil sa co-pilot amp nag iiba iba yung colour nung placeholder everytime na may ilalagay na name!!!! -->
    <div id="controls">
            <input id="p1Name" placeholder="Player 1">
            <input id="p2Name" placeholder="Player 2">
            <select id="difficulty">
                <option value="normal">Normal</option>
                <option value="hard">Hard</option> 
                <!-- Sabi nila basic lang daw yung hard mode amputik -->
            </select>
        </div>
        <!-- SCOREBOARD MERON PERO TIMER WALA AMPUTIK (T-T) -->
        <div id="scoreboard">
            <div id="p1Score">Player 1: 0</div>
            <div id="timer">Time: 5:00</div>
            <div id="turn">Turn: Player 1</div>
            <div id="p2Score">Player 2: 0</div>
        </div>
        <!-- ang weird ng start round butn ang dami nyang ginagawa -->
        <button id="roundBtn" onclick="startRound()">START ROUND</button>
        <div id="arena"></div>
        <div id="message"></div>
        <!-- literal na restart lang talaga yung ginagawa -->
        <div id="gameButtons">
            <button onclick="restartGame()">RESTART</button>
            <button onclick="backToHome()">BACK</button>
        </div>
    </div>
</div>

<!-- display or overlay nung kung sino man yung winner -->
 <!-- hindi ko nalagay yung overlay nung kung sino man yung talo amp -->
<div id="winnerOverlay">
    <h1 id="winnerText">WINNER!</h1>
    <button onclick="closeOverlay()">CLOSE</button>
</div>
<script src="shibalism.js"></script>
 <!-- hindi gumagana ng maayos yung script putik na yan kagabi pa akooooooo -->
</body>
</html>
